# Rerank eval harness — promptfoo
# WEDGE: The Sunday-night roofing DA digest for Sydney subbies — 15 LGAs, 5–15 leads, AUD 199/mo, signup in 60 seconds.
# STACK: docs/00-tech-stack.md @ 2026-Q2 (ai.eval_harness=promptfoo, eval_launch_gate)
#
# Run:   pnpm eval:rerank
# Pass:  ≥ 80% of cases score within ±1 of expected, AND reason contains
#        ≥ 1 expected keyword. Below this, prompt change MUST NOT ship.
description: PI-AU rerank prompt eval — roofing relevance on a 22-case gold set.

prompts:
  - id: rerank-system
    raw: |
      file://../../src/prompts/rerank.system.md

providers:
  - id: anthropic:messages:claude-haiku-4-5
    label: claude-haiku-4-5 (primary)
    config:
      max_tokens: 1024
      temperature: 0
  # Sonnet is the fallback path; eval also runs against it so we can
  # quantify the precision lift before deciding to escalate at runtime.
  - id: anthropic:messages:claude-sonnet-4-6
    label: claude-sonnet-4-6 (fallback)
    config:
      max_tokens: 1024
      temperature: 0

# Each test sends ONE candidate to the model wrapped in the standard
# user-prompt scaffold so we can grade the score+why pair line-by-line.
defaultTest:
  options:
    transform: |
      // Pull the parsed JSON from the model output and pluck the single result.
      const cleaned = output.trim().replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/i, '').trim();
      const parsed = JSON.parse(cleaned);
      return parsed.results[0];
  assert:
    # Score within ±1 of expected (strict launch gate per dev plan)
    - type: javascript
      value: |
        Math.abs(output.score - context.vars.expected_score) <= 1
      metric: score_within_1
    # Reason contains at least one expected keyword (case-insensitive)
    - type: javascript
      value: |
        const why = (output.why || '').toLowerCase();
        const keywords = context.vars.expected_reason_keywords || [];
        return keywords.some(k => why.includes(k.toLowerCase()));
      metric: reason_contains_keyword
    # Schema sanity
    - type: javascript
      value: |
        return typeof output.score === 'number' &&
               typeof output.why === 'string' &&
               typeof output.confidence === 'number' &&
               output.score >= 0 && output.score <= 5 &&
               output.why.length <= 140;
      metric: schema_valid

tests: file://dataset.jsonl

# Aggregate pass criteria — printed in CI summary.
# Dev-plan gate: ≥ 80% within-1 accuracy on this gold set before any
# prompt change ships. promptfoo CLI exits non-zero if assertions fail.
outputPath: ./eval-results/latest.json
